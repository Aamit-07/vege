{% extends "base.html" %}
{% block start %}

<div class="container mt-5 ">
    
    <form class="col-6 mx-auto card p-3 shadow-lg needs-validation" novalidate method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h2>Login</h2>
        <hr>
        {% if messages %}
        {{message.tags}}
        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
            {{ message }}            
            {% endfor %}
          </div>

        {% endif %}
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Username</label>
              <input type="text" class="form-control" name="username" id="exampleInputEmail1" aria-describedby="emailHelp" required>

            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" class="form-control" name="password" id="exampleInputPassword1" required>
            </div>
            <p>Do not have an account <a href="/register/" >Register</a></p>
            <button type="submit" class="btn btn-primary">Submit</button>
    </form>



</div>
    
{% endblock %}

{% block js %}

<script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
(function () {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  var forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.prototype.slice.call(forms)
    .forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }

        form.classList.add('was-validated')
      }, false)
    })
})()
</script>

{% endblock js %}
